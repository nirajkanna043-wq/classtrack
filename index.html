<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClassTrack – Online Class Scheduler & Attendance</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6fa;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--bd:#e5e7eb;--pr:#4f46e5;--prt:#fff;--gr:#16a34a;--grb:#dcfce7;--rd:#dc2626;--rdb:#fee2e2;--am:#d97706;--amb:#fef3c7;--sh:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b24;--tx:#e8eaf0;--mu:#9aa0ae;--bd:#2a2e3b;--pr:#818cf8;--prt:#0f1117;--gr:#4ade80;--grb:#12301f;--rd:#f87171;--rdb:#3b1618;--am:#fbbf24;--amb:#3a2d0c;--sh:none}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#181b24;--tx:#e8eaf0;--mu:#9aa0ae;--bd:#2a2e3b;--pr:#818cf8;--prt:#0f1117;--gr:#4ade80;--grb:#12301f;--rd:#f87171;--rdb:#3b1618;--am:#fbbf24;--amb:#3a2d0c;--sh:none}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.in{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;height:60px;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--pr);display:inline-block}
nav{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer;position:relative}
nav button.on{background:var(--bg);color:var(--tx)}
.badge{background:var(--rd);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px}
main{padding:20px 0 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
h2{margin:0 0 12px;font-size:17px}h3{margin:0;font-size:15px}
.mu{color:var(--mu);font-size:13px}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:9px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:var(--rdb);color:var(--rd)}.btn.sm{padding:5px 10px;font-size:13px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-h div{display:flex;gap:6px;align-items:center}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;font-size:12px;color:var(--mu);padding:4px 0}
.day{aspect-ratio:1/0.9;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);cursor:pointer;padding:6px;text-align:left;font:inherit;display:flex;flex-direction:column;justify-content:space-between;min-height:54px}
.day:hover{border-color:var(--pr)}.day.o{opacity:.35}.day.t{border-color:var(--pr)}
.day.s{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.day small{font-size:11px;font-weight:600;background:var(--amb);color:var(--am);border-radius:6px;padding:0 6px;align-self:flex-start}
.day.s small{background:rgba(255,255,255,.25);color:inherit}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.item:hover{border-color:var(--pr)}.item.nc{cursor:default}.item.nc:hover{border-color:var(--bd)}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.p-g{background:var(--grb);color:var(--gr)}.p-r{background:var(--rdb);color:var(--rd)}.p-a{background:var(--amb);color:var(--am)}.p-n{background:var(--bg);color:var(--mu)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;width:100%}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pr)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.md{background:var(--card);border-radius:16px;width:100%;max-width:540px;max-height:88vh;overflow:auto;padding:22px;border:1px solid var(--bd)}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0}.chk input{width:auto}
.seg{display:flex;gap:6px}
.seg button{border:1px solid var(--bd);background:var(--bg);color:var(--mu);border-radius:8px;padding:5px 12px;font:inherit;cursor:pointer;font-weight:600}
.seg button.p.on{background:var(--grb);color:var(--gr);border-color:var(--gr)}
.seg button.a.on{background:var(--rdb);color:var(--rd);border-color:var(--rd)}
.seg button.r.on{background:var(--amb);color:var(--am);border-color:var(--am)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;text-align:center;border:1px solid transparent}
.chip.y{background:var(--amb);color:var(--am);border-color:var(--am)}
.chip.g{background:var(--grb);color:var(--gr);border-color:var(--gr)}.chip.r{background:var(--rdb);color:var(--rd)}.chip.n{background:var(--bg);color:var(--mu);border-color:var(--bd)}
.chip span{display:block;font-weight:400;font-size:11px}
.empty{text-align:center;color:var(--mu);padding:24px 0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;display:none;font-size:14px;max-width:90%;box-shadow:0 4px 12px rgba(0,0,0,.15);text-align:center}
.day-btn{min-width:44px;text-align:center;transition:all .15s}
.day-btn.active{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.nav-sync-btn{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
</style>
</head>
<body>
<header><div class="in top">
  <div class="logo"><i></i>ClassTrack</div>
  <nav>
    <button data-v="cal" class="on">Calendar</button>
    <button data-v="stu">Students</button>
    <button data-v="bat">Batches</button>
    <button data-v="done">Completed<span class="badge" id="bd" hidden></span></button>
    <button class="nav-sync-btn" id="syncNav" title="Automatic Cloud Sync across all your devices">
      <span id="syncStatusDot">🟢</span>
      <span id="syncStatusText">Auto-Synced</span>
    </button>
  </nav>
</div></header>
<main class="in">
  <section id="cal"></section>
  <section id="stu" hidden></section>
  <section id="bat" hidden></section>
  <section id="done" hidden></section>
</main>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
const KEY = 'classtrack_v1';
const SERVER_KEY = 'classtrack_server_url';
const DEFAULT_CLOUD_ID = 'ff808181a09d98f701a1c4209ae17975';
const DEFAULT_CLOUD_URL = 'https://api.restful-api.dev/objects/' + DEFAULT_CLOUD_ID;

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

let S = { students: [], batches: [], classes: [], att: {} };
let serverUrl = localStorage.getItem(SERVER_KEY) || '';
let hasCustomBackend = false;
let isSyncing = false;

const getApiBase = () => (serverUrl ? serverUrl.replace(/\/$/, '') : '') + '/api';

const j = x => JSON.stringify(x);
let snap = j(S);

function updateSyncBadge(status){
  const dot = document.getElementById('syncStatusDot');
  const txt = document.getElementById('syncStatusText');
  if (!dot || !txt) return;
  if (status === 'syncing') {
    dot.textContent = '⏳';
    txt.textContent = 'Syncing...';
  } else if (status === 'online') {
    dot.textContent = '🟢';
    txt.textContent = 'Auto-Synced';
  } else if (status === 'offline') {
    dot.textContent = '📱';
    txt.textContent = 'Offline';
  } else if (status === 'error') {
    dot.textContent = '⚠️';
    txt.textContent = 'Sync Issue';
  }
}

const saveLocal = () => {
  try { localStorage.setItem(KEY, j(S)); } catch(e){}
};

// Immediate Cloud Push
async function pushToCloudNow(){
  try {
    updateSyncBadge('syncing');
    const r = await fetch(DEFAULT_CLOUD_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: 'classtrack_nirajkanna043_db',
        data: S
      })
    });
    if (r.ok) {
      updateSyncBadge('online');
      return true;
    } else {
      updateSyncBadge('error');
      return false;
    }
  } catch(e) {
    updateSyncBadge('offline');
    return false;
  }
}

// Automatic Default Cloud Loading
async function loadState(isSilent = false){
  // 1. If user set a custom backend URL (like Render), try it first
  if (serverUrl) {
    try {
      const r = await fetch(getApiBase() + '/state');
      if (r.ok) {
        S = await r.json();
        hasCustomBackend = true;
        saveLocal();
        snap = j(S);
        updateSyncBadge('online');
        return;
      }
    } catch(e){
      hasCustomBackend = false;
    }
  }

  // Check existing local storage cache
  let localData = null;
  try {
    const local = localStorage.getItem(KEY);
    if (local) localData = JSON.parse(local);
  } catch(err){}

  // 2. Default Automatic Cloud Sync: fetch from cloud database (cache-busted for iOS Safari)
  try {
    const r = await fetch(DEFAULT_CLOUD_URL + '?_t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const res = await r.json();
      if (res && res.data && Array.isArray(res.data.students)) {
        const cloudData = {
          students: res.data.students || [],
          batches: res.data.batches || [],
          classes: res.data.classes || [],
          att: res.data.att || {}
        };

        // Auto-migration: If cloud is currently empty but local browser has students/batches,
        // automatically upload the local data to the cloud so all other devices receive it immediately!
        if (cloudData.students.length === 0 && cloudData.batches.length === 0 && localData && (localData.students?.length > 0 || localData.batches?.length > 0)) {
          S = {
            students: localData.students || [],
            batches: localData.batches || [],
            classes: localData.classes || [],
            att: localData.att || {}
          };
          saveLocal();
          snap = j(S);
          await pushToCloudNow();
          updateSyncBadge('online');
          return;
        }

        const prevSnap = j(S);
        S = cloudData;
        saveLocal();
        snap = j(S);
        updateSyncBadge('online');
        if (isSilent && prevSnap !== snap) {
          render();
        }
        return;
      }
    }
  } catch(err) {
    console.warn('Default cloud fetch failed, using local cache:', err);
  }

  // 3. Fallback to local storage if offline
  if (localData) S = localData;
  snap = j(S);
  updateSyncBadge('offline');
}

// Custom backend sync helper
const api = (m, u, b) => fetch(getApiBase() + u, {
  method: m,
  headers: { 'Content-Type': 'application/json' },
  body: b ? JSON.stringify(b) : undefined
}).then(r => {
  if (!r.ok && r.status !== 404) throw new Error(r.status);
  return r;
});

async function syncCustomBackend(){
  if (!hasCustomBackend) return;
  const old = JSON.parse(snap), cur = JSON.parse(j(S));
  snap = j(cur);
  for (const c of ['students', 'batches', 'classes']) {
    const o = {}, n = {};
    old[c].forEach(x => o[x.id] = x);
    cur[c].forEach(x => n[x.id] = x);
    for (const x of cur[c]) {
      if (!o[x.id]) await api('POST', '/' + c, x);
      else if (j(o[x.id]) !== j(x)) await api('PUT', '/' + c + '/' + x.id, x);
    }
    for (const id in o) if (!n[id]) await api('DELETE', '/' + c + '/' + id);
  }
  for (const cid in cur.att) for (const sid in cur.att[cid]) {
    const v = cur.att[cid][sid];
    if (!old.att[cid] || old.att[cid][sid] !== v) await api('PUT', '/attendance', { classId: cid, studentId: sid, status: v });
  }
  for (const cid in old.att) for (const sid in old.att[cid]) {
    if (!cur.att[cid] || !cur.att[cid][sid]) await api('DELETE', '/attendance/' + cid + '/' + sid);
  }
}

// Automatic Default Cloud Saving (with 300ms debounce)
let cloudSaveTimer = null;
let q = Promise.resolve();

const save = (immediate = false) => {
  saveLocal();
  updateSyncBadge('syncing');

  if (serverUrl && hasCustomBackend) {
    q = q.then(syncCustomBackend).catch(() => console.warn('Custom backend sync failed'));
  }

  clearTimeout(cloudSaveTimer);
  if (immediate) {
    pushToCloudNow();
  } else {
    cloudSaveTimer = setTimeout(pushToCloudNow, 300);
  }
};

// Automatic real-time background sync:
// 1. When switching back to tab (e.g. iPad unlocked or browser focused)
window.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    const ov = document.getElementById('ov');
    if (!ov || !ov.classList.contains('on')) {
      loadState(true);
    }
  }
});
window.addEventListener('focus', () => {
  const ov = document.getElementById('ov');
  if (!ov || !ov.classList.contains('on')) {
    loadState(true);
  }
});
// 2. Periodic background check every 6 seconds so iPad sees laptop changes almost immediately
setInterval(() => {
  const ov = document.getElementById('ov');
  if (!ov || !ov.classList.contains('on')) {
    loadState(true);
  }
}, 6000);

// Flush any pending save before leaving
window.addEventListener('beforeunload', () => {
  if (cloudSaveTimer) {
    clearTimeout(cloudSaveTimer);
    try {
      fetch(DEFAULT_CLOUD_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'classtrack_nirajkanna043_db', data: S }),
        keepalive: true
      });
    } catch(e){}
  }
});

const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = ymd(new Date());

let view='cal', cur=new Date(), sel=today;
cur.setDate(1);

const fmt = d => new Date(d+'T00:00').toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short', year:'numeric'});
const stu = id => S.students.find(s => s.id === id);
const bn = c => { const b = S.batches.find(x => x.id === c.bid); return b ? esc(b.name)+' · ' : ''; };
const toast = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3200); };
const isOver = (c, sid) => !!(S.att[c.id] && S.att[c.id][sid]) || new Date(c.date + 'T' + (c.time || '00:00')).getTime() + 36e5 < Date.now();
const scheduled = sid => S.classes.filter(c => c.sids.includes(sid)).sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));

function stats(s){
  const l = scheduled(s.id);
  const over = l.filter(c => isOver(c, s.id));
  return { list: l, over: over.length, total: l.length, done: s.quota > 0 && l.length >= s.quota && over.length === l.length };
}

function open(html){ $('md').innerHTML = html; $('ov').classList.add('on'); }
function close(){ $('ov').classList.remove('on'); }
function confirmBox(msg, fn){
  open('<h2>Please confirm</h2><p>' + msg + '</p><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn g" id="cn0">Cancel</button><button class="btn d" id="cy0">Yes, continue</button></div>');
  $('cn0').onclick = close;
  $('cy0').onclick = fn;
}
$('ov').addEventListener('click', e => { if (e.target.id === 'ov') close(); });

/* ---------- Cloud Sync Status & Backup Modal (No QR code needed) ---------- */
function openSyncModal(){
  open('<h2>Automatic Cloud Sync</h2>' +
    '<div style="background:var(--grb);color:var(--gr);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px">' +
      '<span style="font-size:22px">🟢</span>' +
      '<div>' +
        '<div>Cloud Sync is Active & 100% Automatic</div>' +
        '<div style="font-size:12px;font-weight:normal;color:var(--tx);margin-top:2px">Any students, batches, or attendance added on your laptop, iPad, or mobile automatically sync with zero setup.</div>' +
      '</div>' +
    '</div>' +

    '<div style="background:var(--bg);padding:14px;border-radius:12px;border:1px solid var(--bd);margin-bottom:14px">' +
      '<div style="font-size:13px;margin-bottom:10px"><b>Current Cloud Data:</b> ' + S.students.length + ' students · ' + S.batches.length + ' batches · ' + S.classes.length + ' classes</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn sm" id="forceCloudSyncBtn">🔄 Sync / Refresh Now</button>' +
        '<button class="btn g sm" id="expDownload">📥 Download Backup (.json)</button>' +
        '<button class="btn g sm" id="impFileBtn">📤 Restore from Backup</button>' +
      '</div>' +
    '</div>' +

    '<div style="display:flex;justify-content:flex-end">' +
      '<button class="btn g" id="syncClose">Done</button>' +
    '</div>');

  $('syncClose').onclick = close;

  $('forceCloudSyncBtn').onclick = () => {
    toast('Syncing with cloud database...');
    loadState(false).then(() => {
      render();
      toast('Synced! Loaded ' + S.students.length + ' students and ' + S.batches.length + ' batches.');
      close();
    });
  };

  $('expDownload').onclick = () => {
    const blob = new Blob([j(S)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'classtrack_backup_' + today + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Backup file downloaded.');
  };

  $('impFileBtn').onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json';
    inp.onchange = e => {
      const file = e.target.files[0];
      if (file) {
        const r = new FileReader();
        r.onload = ev => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (!parsed || !Array.isArray(parsed.students)) throw new Error('Invalid format');
            S = {
              students: parsed.students || [],
              batches: parsed.batches || [],
              classes: parsed.classes || [],
              att: parsed.att || {}
            };
            save(true);
            render();
            close();
            toast('Imported backup! Restored ' + S.students.length + ' students.');
          } catch(err) {
            toast('Failed to import file: ' + err.message);
          }
        };
        r.readAsText(file);
      }
    };
    inp.click();
  };
}

/* ---------- Calendar ---------- */
function renderCal(){
  const y=cur.getFullYear(), m=cur.getMonth();
  const first=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<first;i++) cells+='<div></div>';
  for(let d=1;d<=dim;d++){
    const k=y+'-'+pad(m+1)+'-'+pad(d), n=S.classes.filter(c=>c.date===k).length;
    cells+='<button class="day ' + (k===today?'t':'') + ' ' + (k===sel?'s':'') + '" data-d="' + k + '"><b>' + d + '</b>' + (n?'<small>' + n + ' class' + (n>1?'es':'') + '</small>':'<span></span>') + '</button>';
  }
  const cl=S.classes.filter(c=>c.date===sel).sort((a,b)=>a.time.localeCompare(b.time));
  $('cal').innerHTML='<div class="grid">' +
   '<div class="card"><div class="cal-h"><h2 style="margin:0">' + cur.toLocaleDateString(undefined,{month:'long',year:'numeric'}) + '</h2>' +
    '<div><button class="btn g sm" id="pv">‹</button><button class="btn g sm" id="tdy">Today</button><button class="btn g sm" id="nx">›</button></div></div>' +
    '<div class="dow">' + DAYS_SHORT.map(x=>'<span>'+x+'</span>').join('') + '</div><div class="days">' + cells + '</div></div>' +
   '<div class="card"><div class="cal-h"><div style="display:block"><h2 style="margin:0">' + fmt(sel) + '</h2><span class="mu">' + cl.length + ' scheduled</span></div><button class="btn sm" id="add">+ Class</button></div>' +
    (cl.length?cl.map(c=>{
      const p=Object.values(S.att[c.id]||{}).filter(v=>v==='p').length, mk=Object.keys(S.att[c.id]||{}).length;
      return '<div class="item" data-c="' + c.id + '"><div><h3>' + esc(c.name) + '</h3><span class="mu">' + bn(c) + c.time + ' · ' + c.sids.length + ' student' + (c.sids.length!==1?'s':'') + '</span></div>' +

/* Helper to get upcoming date for a day index */
function getEarliestUpcomingDate(selectedDays, fromDateStr = today) {
  if (!selectedDays || !selectedDays.length) return fromDateStr;
  const now = new Date(fromDateStr + 'T00:00:00');
  let minDiff = 8;
  for (const dayIdx of selectedDays) {
    let diff = dayIdx - now.getDay();
    if (diff < 0) diff += 7;
    if (diff < minDiff) minDiff = diff;
  }
  const d = new Date(now);
  d.setDate(d.getDate() + minDiff);
  return ymd(d);
}

function getDatesForSelectedDays(selectedDays, startDateStr, weeksCount) {
  const cur = new Date(startDateStr + 'T00:00:00');
  const dates = [];
  const totalDays = weeksCount * 7;
  for (let i = 0; i < totalDays; i++) {
    if (selectedDays.includes(cur.getDay())) {
      dates.push(ymd(cur));
    }
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}

      selectedWeeks = Math.max(1, parseInt($('bweeks').value) || 1);

      const cnt = selectedDays.length * selectedWeeks;
      $('schedulePreviewBanner').textContent = '📅 Will automatically schedule: ' + cnt + ' classes (' + selectedDays.length + ' days × ' + selectedWeeks + ' weeks)';
      document.querySelectorAll('#md .week-preset').forEach(btn => {
        btn.className = 'btn sm week-preset ' + (parseInt(btn.dataset.w) === selectedWeeks ? '' : 'g');
      });
    }

    if ($('ball')) {
      $('ball').onclick = () => {
        const inputs = document.querySelectorAll('#md .chk input[type="checkbox"]');
        const allChecked = [...inputs].every(i => i.checked);
        inputs.forEach(i => i.checked = !allChecked);
        $('ball').textContent = allChecked ? 'Select All' : 'Deselect All';
      };
    }

    // Save handler
    $('bs').onclick = () => {
      const name = $('bnm').value.trim();
      const time = $('btm').value;
      const startDate = $('bstart').value;
      const weeks = Math.max(1, parseInt($('bweeks').value) || 1);
      const ids = [...document.querySelectorAll('#md .chk input[type="checkbox"]:checked')].map(i => i.value);

      if (!name) { toast('Please enter a batch name.'); return; }
      if (!selectedDays.length) { toast('Please select at least 1 class day (e.g. 2 days per week).'); return; }
      if (!time) { toast('Please enter a class time.'); return; }
      if (!startDate) { toast('Please select a start date.'); return; }

      let batchId = id;
      if (id) {
        b.name = name;
        b.sids = ids;
        b.days = selectedDays;
        b.day = selectedDays[0];
        b.time = time;
        b.weeks = weeks;
      } else {
        batchId = uid();
        const newBatch = {
          id: batchId,
          name,
          sids: ids,
          days: selectedDays,
          day: selectedDays[0],
          time,
          weeks
        };
        S.batches.push(newBatch);
      }

      const shouldSchedule = !id || ($('bsched') && $('bsched').checked);
      let made = 0;
      const skipped = new Set();

      if (shouldSchedule && ids.length) {
        const scheduledDates = getDatesForSelectedDays(selectedDays, startDate, weeks);
        
        scheduledDates.forEach((dateStr, idx) => {
          const ok = ids.filter(sid => {
            const s = stu(sid);
            if (!s) return false;
            if (scheduled(sid).length < s.quota) return true;
            skipped.add(s.name);
            return false;
          });

          if (ok.length) {
            S.classes.push({
              id: uid(),
              name: name + ' (Session ' + (idx + 1) + ')',
              date: dateStr,
              time,
              bid: batchId,
              sids: ok
            });
            made++;
          }
        });
      }

      save();
      close();
      render();

      if (shouldSchedule) {
        if (made) {
          toast('🎉 Batch saved! Scheduled ' + made + ' classes across ' + weeks + ' weeks on ' + selectedDaysNames + '.' + (skipped.size ? ' (Quota reached: ' + [...skipped].join(', ') + ')' : ''));
        } else if (ids.length) {
          toast('Batch saved, but students reached their class quota.');
        } else {
          toast('Batch saved without classes (no students selected).');
        }
      } else {
        toast('Batch updated successfully.');
      }
    };
  };

  renderModalContent();
}

     else if (b.day !== null && b.day !== undefined) daysList = [b.day];
     
     const daysText = daysList.length ? daysList.slice().sort((x,y)=>(x===0?7:x)-(y===0?7:y)).map(d => DAYS_SHORT[d]).join(', ') : 'Flexible';
     const schedInfo = daysText + ' at ' + (b.time || '10:00') + ' · ' + (b.weeks ? b.weeks + ' wks recurring · ' : '');
     
     return '<div class="item nc"><div style="flex:1">' +
       '<h3>' + esc(b.name) + '</h3>' +
       '<span class="mu">' + schedInfo + b.sids.length + ' student' + (b.sids.length!==1?'s':'') + ': ' + (b.sids.map(i=>stu(i)).filter(Boolean).map(s=>'<span style="color:var(--pr);text-decoration:underline;cursor:pointer" data-sh="' + s.id + '" title="Click to view attendance history">' + esc(s.name) + '</span>').join(', ')||'none') + '</span>' +
     '</div>' +
     '<div style="display:flex;gap:6px"><button class="btn g sm" data-be="' + b.id + '">Edit</button><button class="btn d sm" data-bd="' + b.id + '">Delete</button></div></div>';
   }).join(''):'<div class="empty">No batches yet. Click "+ New batch" to select your days and schedule classes automatically across weeks.</div>') + '</div>';

  $('nb').onclick=()=>batchForm();
  document.querySelectorAll('#bat [data-sh]').forEach(el => el.onclick = () => showStudentHistory(el.dataset.sh));
  document.querySelectorAll('[data-be]').forEach(x=>x.onclick=()=>batchForm(x.dataset.be));
  document.querySelectorAll('[data-bd]').forEach(x=>x.onclick=()=>confirmBox('Delete this batch? Already scheduled classes stay.',()=>{S.batches=S.batches.filter(b=>b.id!==x.dataset.bd);save();close();render();}));
}

function render(){
  const n=S.students.filter(s=>stats(s).done).length,b=$('bd');b.hidden=!n;b.textContent=n;
  ['cal','stu','bat','done'].forEach(v=>$(v).hidden=v!==view);
  if(view==='cal')renderCal();if(view==='stu')renderStu();if(view==='bat')renderBat();if(view==='done')renderDone();
}

document.querySelectorAll('nav button[data-v]').forEach(b=>b.onclick=()=>{
  view=b.dataset.v;
  document.querySelectorAll('nav button[data-v]').forEach(x=>x.classList.toggle('on',x===b));
  render();
  loadState(true);
});

$('syncNav').onclick = openSyncModal;

// Instant initial render from local cache to prevent empty screen on load
try {
  const local = localStorage.getItem(KEY);
  if (local) {
    const parsed = JSON.parse(local);
    if (parsed && Array.isArray(parsed.students)) {
      S = parsed;
      snap = j(S);
    }
  }
} catch(e){}
render();

loadState().then(render);
setInterval(()=>{const n=S.students.filter(s=>stats(s).done).length;$('bd').hidden=!n;$('bd').textContent=n},60000);
})();
</script>
</body>
</html>
